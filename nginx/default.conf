server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 20m;

    # Security headers available even when using local HTTP for the exam.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # WordPress administrative routes pass through the same reverse proxy.
    location / {
        proxy_pass http://wordpress:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Nginx must not pass hidden files or configuration files downstream.
    location ~ /\. { return 404; }
    location ~* /wp-config\.php$ { return 404; }
}
